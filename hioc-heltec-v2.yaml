substitutions:
  device_name: hioc-heltec-v2
  device_friendly_name: Home IO Control WiFi LoRa32 V2

<<: !include common/base.yaml

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  build_flags:
    - -DIOHOME_FRAME_LOG

  devices:
    - id: device_awning
      name: "Patio Awning"
    - id: device_dimmer
      name: "Dimmable Light"

# Board SPI bus + radio pinout — single source of truth in config/boards/.
packages:
  board: !include common/heltec-v2.yaml

logger:
  level: DEBUG

i2c:
  sda: 4
  scl:
    number: 15
    ignore_strapping_warning: true
  scan: false
  frequency: 400kHz

external_components:
  - source:
      type: local
      path: components
      
home_io_control:
  node_id: !secret hub_node_id
  system_key: !secret hub_system_key
  exposed_senders:
    - !secret example_io_device_linked_remote_id
  accept_foreign_pairing: true
  discover_and_pair_button: true

cover:
  - platform: home_io_control
    device_id: device_awning
    id: patio_awning
    name: "Patio Awning"
    device_class: awning
    io_device_id: !secret example_io_device_id
    io_device_type: "horizontal_awning"
    io_subtype: 0
    invert_position: true
    status_poll_interval: 1000ms
    linked_remotes:
      - !secret example_io_device_linked_remote_id

light:
  - platform: home_io_control
    id: dimmable_light
    device_id: device_dimmer
    name: "Dimmable Light"
    io_device_id: !secret example_io_light_device_id
    io_device_type: "light"
    io_subtype: 0
    dimmable: true