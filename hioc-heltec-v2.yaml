substitutions:
  device_name: hioc-heltec-v2
  device_friendly_name: Home IO Control WiFi LoRa32 V2

<<: !include common/base.yaml

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  on_boot:
    priority: 600
    then:
      - output.turn_on: oled_vext
  build_flags:
    - -DIOHOME_FRAME_LOG

  devices:
    - id: device_awning
      name: "Patio Awning"
    - id: device_dimmer
      name: "Dimmable Light"

esp32:
  variant: esp32
  framework:
    type: esp-idf

spi:
  clk_pin:
    number: 5
    # GPIO5 is a strapping pin on the ESP32; it is only ever driven as SPI CLK here.
    ignore_strapping_warning: true
  mosi_pin: 27
  miso_pin: 19

home_io_control:
  cs_pin: 18
  rst_pin: 14
  dio0_pin: 26
  radio_type: sx1276

# Board SPI bus + radio pinout — single source of truth in config/boards/.
packages:
  board: !include boards/heltec-v2.yaml

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: 4
  scl:
    number: 15
    ignore_strapping_warning: true
  scan: false
  frequency: 400kHz

external_components:
  - source:
      type: local
      path: components

font:
  - file: "gfonts://Roboto"
    id: oled_font_small
    size: 12
  - file: "gfonts://Roboto"
    id: oled_font_title
    size: 16

output:
  - platform: gpio
    id: oled_vext
    pin:
      number: 21
      inverted: true
      
home_io_control:
  node_id: !secret hub_node_id
  system_key: !secret hub_system_key
  exposed_senders:
    - !secret example_io_device_linked_remote_id
  accept_foreign_pairing: true
  discover_and_pair_button: true

cover:
  - platform: home_io_control
    device_id: device_awning
    id: patio_awning
    name: "Patio Awning"
    device_class: awning
    io_device_id: !secret example_io_device_id
    io_device_type: "horizontal_awning"
    io_subtype: 0
    invert_position: true
    status_poll_interval: 1000ms
    linked_remotes:
      - !secret example_io_device_linked_remote_id
    on_opening:
      - script.execute:
          id: oled_show_state
          cover_label: "Patio"
          status_text: "Opening"
    on_closing:
      - script.execute:
          id: oled_show_state
          cover_label: "Patio"
          status_text: "Closing"
    on_idle:
      - script.execute:
          id: oled_show_idle
          cover_label: "Patio"
          position: !lambda 'return id(patio_awning).position;'

light:
  - platform: home_io_control
    id: dimmable_light
    device_id: device_dimmer
    name: "Dimmable Light"
    io_device_id: !secret example_io_light_device_id
    io_device_type: "light"
    io_subtype: 0
    dimmable: true