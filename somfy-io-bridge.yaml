---
substitutions:
  name: somfy-io-bridge
  friendly_name: Somfy_IO_Bridge

packages:
  board: !include common/heltec-v2.yaml
  base: !include common/base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # build_flags:
  #   - -DIOHOME_FRAME_LOG
  on_boot:
    priority: 600
    then:
      - output.turn_on: led_ble
      - output.turn_off: led_wifi
      - output.turn_off: led_lora

external_components:
  # renovate: branch=main
  - source: github://laberning/home_io_control@57467e817732d1461b2f788e5ae3313e50f7c69c
    components: [home_io_control]

logger:
  level: WARN

wifi:
  on_connect:
    - output.turn_on: led_wifi
  on_disconnect:
    - output.turn_off: led_wifi

output:
  - platform: gpio
    id: led_lora
    pin: GPIO22
  - platform: gpio
    id: led_wifi
    pin: GPIO23
  - platform: gpio
    id: led_ble
    pin: GPIO25

home_io_control:
  # Keep these values stable after enrolling the bridge with a Somfy IO device.
  node_id: !secret somfy_io_hub_node_id
  system_key: !secret somfy_io_hub_system_key

  # Exposes only known 1W remotes as Home Assistant events. Add each remote
  # here once, then select explicitly which ones follow each device below.
  exposed_senders:
    - !secret somfy_io_1w_remote_volet_veranda_id
    - !secret somfy_io_1w_remote_volet_veranda1_id
    - !secret somfy_io_1w_remote_volet_veranda2_id
    - !secret somfy_io_1w_remote_volet_veranda3_id
    - !secret somfy_io_1w_remote_volet_veranda4_id
    - !secret somfy_io_1w_remote_volet_veranda5_id
    - !secret somfy_io_1w_remote_lumiere_veranda_id

  # 2W onboarding helpers. They can be removed after 2W devices are configured.
  # discover_and_pair_button: true
  # accept_foreign_pairing: true
  # scan_paired_devices_button: true

  # One virtual 1W controller represents one independently controlled device.
  # Duplicate this block with a different id when adding another actuator.
  oneway_controllers:
    - id: volet_veranda_1w_1
      io_device_type: roller_shutter
      commands: [open, close, stop]
      manufacturer: somfy
      execute_broadcast: all
      # enrollment: true
      node_id: !secret somfy_io_1w_volet_veranda1_id
      cover: "Volet véranda 1 (1W)"
      drives:
        - !secret somfy_io_2w_volet_veranda1_id
      device_class: shutter
      open_duration: 25s
      close_duration: 25s
      set_position: timed
      follows:
        - !secret somfy_io_1w_remote_volet_veranda_id
        - !secret somfy_io_1w_remote_volet_veranda1_id

    - id: volet_veranda_1w_2
      io_device_type: roller_shutter
      commands: [open, close, stop]
      manufacturer: somfy
      execute_broadcast: all
      # enrollment: true
      node_id: !secret somfy_io_1w_volet_veranda2_id
      cover: "Volet véranda 2 (1W)"
      drives:
        - !secret somfy_io_2w_volet_veranda2_id
      device_class: shutter
      open_duration: 25s
      close_duration: 25s
      set_position: timed
      follows:
        - !secret somfy_io_1w_remote_volet_veranda_id
        - !secret somfy_io_1w_remote_volet_veranda2_id

    - id: volet_veranda_1w_3
      io_device_type: roller_shutter
      commands: [open, close, stop]
      manufacturer: somfy
      execute_broadcast: all
      # enrollment: true
      node_id: !secret somfy_io_1w_volet_veranda3_id
      cover: "Volet véranda 3 (1W)"
      drives:
        - !secret somfy_io_2w_volet_veranda3_id
      device_class: shutter
      open_duration: 25s
      close_duration: 25s
      set_position: timed
      follows:
        - !secret somfy_io_1w_remote_volet_veranda_id
        - !secret somfy_io_1w_remote_volet_veranda3_id

    - id: volet_veranda_1w_4
      io_device_type: roller_shutter
      commands: [open, close, stop]
      manufacturer: somfy
      execute_broadcast: all
      # enrollment: true
      node_id: !secret somfy_io_1w_volet_veranda4_id
      cover: "Volet véranda 4 (1W)"
      drives:
        - !secret somfy_io_2w_volet_veranda4_id
      device_class: shutter
      open_duration: 25s
      close_duration: 25s
      set_position: timed
      follows:
        - !secret somfy_io_1w_remote_volet_veranda_id
        - !secret somfy_io_1w_remote_volet_veranda4_id

    - id: volet_veranda_1w_5
      io_device_type: roller_shutter
      commands: [open, close, stop]
      manufacturer: somfy
      execute_broadcast: all
      # enrollment: true
      node_id: !secret somfy_io_1w_volet_veranda5_id
      cover: "Volet véranda 5 (1W)"
      drives:
        - !secret somfy_io_2w_volet_veranda5_id
      device_class: shutter
      open_duration: 25s
      close_duration: 25s
      set_position: timed
      follows:
        - !secret somfy_io_1w_remote_volet_veranda_id
        - !secret somfy_io_1w_remote_volet_veranda5_id

light:
  - platform: home_io_control
    id: lumiere_veranda_2w_1
    name: "Lumiere Veranda 1"
    io_device_id: !secret somfy_io_2w_lumiere_veranda1_id
    dimmable: true
    linked_remotes:
      - !secret somfy_io_1w_remote_lumiere_veranda_id

  - platform: home_io_control
    id: lumiere_veranda_2w_2
    name: "Lumiere Veranda 2"
    io_device_id: !secret somfy_io_2w_lumiere_veranda2_id
    dimmable: true
    linked_remotes:
      - !secret somfy_io_1w_remote_lumiere_veranda_id

  - platform: home_io_control
    id: lumiere_veranda_2w_3
    name: "Lumiere Veranda 3"
    io_device_id: !secret somfy_io_2w_lumiere_veranda3_id
    dimmable: true
    linked_remotes:
      - !secret somfy_io_1w_remote_lumiere_veranda_id

  - platform: home_io_control
    id: lumiere_veranda_2w_4
    name: "Lumiere Veranda 4"
    io_device_id: !secret somfy_io_2w_lumiere_veranda4_id
    dimmable: true
    linked_remotes:
      - !secret somfy_io_1w_remote_lumiere_veranda_id

cover:
  - platform: home_io_control
    id: volet_veranda_2w_1
    name: "Volet véranda 1 (2W)"
    io_device_id: !secret somfy_io_2w_volet_veranda1_id
    io_device_type: "vertical_exterior_awning"
    invert_position: false
    status_poll_interval: 2s
    travel_speed: silent
    linked_remotes:
      - !secret somfy_io_1w_remote_volet_veranda_id
      - !secret somfy_io_1w_remote_volet_veranda1_id
    optimistic_state: true

  - platform: home_io_control
    id: volet_veranda_2w_2
    name: "Volet véranda 2 (2W)"
    io_device_id: !secret somfy_io_2w_volet_veranda2_id
    io_device_type: "vertical_exterior_awning"
    invert_position: false
    status_poll_interval: 2s
    travel_speed: silent
    linked_remotes:
      - !secret somfy_io_1w_remote_volet_veranda_id
      - !secret somfy_io_1w_remote_volet_veranda2_id
    optimistic_state: true

  - platform: home_io_control
    id: volet_veranda_2w_3
    name: "Volet véranda 3 (2W)"
    io_device_id: !secret somfy_io_2w_volet_veranda3_id
    io_device_type: "vertical_exterior_awning"
    invert_position: false
    status_poll_interval: 2s
    travel_speed: silent
    linked_remotes:
      - !secret somfy_io_1w_remote_volet_veranda_id
      - !secret somfy_io_1w_remote_volet_veranda3_id
    optimistic_state: true

  - platform: home_io_control
    id: volet_veranda_2w_4
    name: "Volet véranda 4 (2W)"
    io_device_id: !secret somfy_io_2w_volet_veranda4_id
    io_device_type: "vertical_exterior_awning"
    invert_position: false
    status_poll_interval: 2s
    travel_speed: silent
    linked_remotes:
      - !secret somfy_io_1w_remote_volet_veranda_id
      - !secret somfy_io_1w_remote_volet_veranda4_id
    optimistic_state: true

  - platform: home_io_control
    id: volet_veranda_2w_5
    name: "Volet véranda 5 (2W)"
    io_device_id: !secret somfy_io_2w_volet_veranda5_id
    io_device_type: "vertical_exterior_awning"
    invert_position: false
    status_poll_interval: 2s
    travel_speed: silent
    linked_remotes:
      - !secret somfy_io_1w_remote_volet_veranda_id
      - !secret somfy_io_1w_remote_volet_veranda5_id
    optimistic_state: true

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
